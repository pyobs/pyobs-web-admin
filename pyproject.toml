[project]
name = "pyobs-web-admin"
version = "2.0.0.dev10"
description = "Web-based administration interface for pyobs robotic telescope modules"
authors = [
    { name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" },
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "gunicorn>=26.0.0",
    "packaging>=24.0",
    "psutil>=6.0",
    "pyobs-auth>=2.0.0.dev7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "ruamel.yaml>=0.18",
    "whitenoise>=6.8",
]
