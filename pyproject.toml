[project]
name = "pyobs-web-admin"
version = "2.0.0.dev13"
description = "Web-based administration interface for pyobs robotic telescope modules"
authors = [
    { name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" },
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "gunicorn>=26.0.0",
    "packaging>=24.0",
    "psutil>=6.0",
    "pyobs-auth>=2.0.0.dev9",
    "pyyaml>=6.0",
    "requests>=2.32",
    "ruamel.yaml>=0.18",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "pyrefly>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]
ignore = ["E501"]

[tool.pyrefly]
project-includes = ["modules", "pyobs_web_admin"]
project-excludes = ["**/docs/", "**/migrations/"]
python-version = "3.12.0"
preset = "legacy"
# local_settings.py is gitignored (optional per-deployment override, see settings.py's
# try/except ImportError) -- never present in CI or a fresh checkout.
ignore-missing-imports = ["pyobs_web_admin.local_settings"]

[tool.pyrefly.errors]
redundant-cast = "warn"
